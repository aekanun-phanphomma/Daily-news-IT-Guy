name: Daily DevOps News

on:
  schedule:
    # 00:00 UTC == 07:00 Asia/Bangkok (UTC+7, no DST ever, so this never drifts
    # seasonally). GitHub's scheduler is best-effort and queues on the hour are
    # long, so expect the run to land a few minutes to ~30 minutes late. The
    # bot is date-stamped, not minute-critical, so that is fine.
    - cron: "0 0 * * *"
  # Manual trigger from the Actions tab, for testing and for catching up a
  # missed day.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview in the logs without posting to Discord"
        type: boolean
        default: false

# The job pushes a commit back to the default branch. Scheduled runs cannot
# overlap at a 24h interval, but a manual run during a scheduled one could, and
# two jobs pushing the same file would collide.
concurrency:
  group: daily-news
  cancel-in-progress: false

permissions:
  # Needed to commit the updated data/seen_urls.json. Everything else stays at
  # the default of no access.
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    # The real run takes well under a minute. This is a tripwire for a feed
    # that accepts a connection and then never answers.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # setup-python can restore pip's wheel cache keyed on
          # requirements.txt, which cuts install time to a couple of seconds.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        # Catches a syntax error here instead of halfway through fetching feeds.
        run: python -m compileall -q src

      - name: Build and send digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional. Absent secrets arrive as an empty string, which the
          # script reads as "feature off".
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Lifts the GitHub Search API rate limit for the trending lookup.
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # "text" renders in any channel. Switch to "embed" for the nicer
          # format once the channel grants Embed Links to @everyone -- see the
          # output format section of the README.
          DISCORD_FORMAT: text
          # Optional secondary channel. The token expires 60 days after it is
          # issued and standard apps get no refresh token, so expect to rotate
          # this by hand -- a 401 fails the job on purpose rather than going
          # quiet. See the LinkedIn section of the README.
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          # Optional secondary channel. Unlike LinkedIn this token does not
          # expire, so there is no rotation reminder to keep -- as long as the
          # Meta app is never published. See the Facebook section of the
          # README for why.
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python src/main.py

      - name: Commit dedup state
        # Deliberately not `success()`. The script writes seen_urls.json itself
        # and only after the primary channel confirms delivery, so if the file
        # changed, those items really were sent and the state must be kept --
        # even when a secondary channel (LinkedIn or Facebook) failed the job.
        # Using success() here would resend a whole day of Discord items
        # tomorrow because one of those tokens stopped working.
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nothing to commit is the normal outcome on a quiet day.
          if git diff --quiet -- data/seen_urls.json; then
            echo "seen_urls.json unchanged - nothing to commit"
            exit 0
          fi

          git add data/seen_urls.json
          git commit -m "chore: update seen urls [skip ci]"

          # This workflow only triggers on schedule and workflow_dispatch, so
          # this push cannot re-trigger it. The [skip ci] tag is belt and
          # braces for any push-triggered workflow added later.
          git push
